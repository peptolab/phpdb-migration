name: "Continuous Integration"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    uses: php-db/phpdb-qa-tools/.github/workflows/continuous-integration.yml@0.1.x
    secrets: inherit
    with:
      php-versions: '["8.3", "8.4", "8.5"]'
      run-integration: true
      db-image: "mysql:8.0"
      db-port: "3306"
      db-env-json: '{"MYSQL_ROOT_PASSWORD":"root","MYSQL_DATABASE":"phpdb_migration_test"}'
      db-health-cmd: "mysqladmin ping -h127.0.0.1 -uroot -proot --silent"
